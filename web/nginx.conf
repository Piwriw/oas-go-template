server {
    listen       8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # Static-export fallback: direct hits and refreshes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Next emits content-hashed filenames under /_next/static/* — they're
    # immutable and safe to cache aggressively.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
